syntax = "proto3";

package sc.internal.services.longterm.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sc/external/common/command/v1/types.proto";
import "sc/external/common/api/v1/query.proto";
import "sc/external/common/api/v1/pagination.proto";
import "sc/external/services/longterm/v1/types.proto";
import "sc/internal/services/longterm/v1/commands.proto";

service LongTermService {
  rpc QueryOwnershipRecords ( .sc.internal.services.longterm.v1.QueryOwnershipRecordsRequest ) returns ( .sc.internal.services.longterm.v1.QueryOwnershipRecordsResponse );
  rpc SetPersistentVariables ( .sc.internal.services.longterm.v1.SetPersistentVariablesRequest ) returns ( .sc.internal.services.longterm.v1.SetPersistentVariablesResponse );
  rpc ChangePersistentVariables ( .sc.internal.services.longterm.v1.ChangePersistentVariablesRequest ) returns ( .sc.internal.services.longterm.v1.ChangePersistentVariablesResponse );
}

message QueryOwnershipRecordsRequest {
  .sc.external.common.api.v1.Query query = 1;
}

message QueryOwnershipRecordsResponse {
  .sc.external.common.api.v1.PaginationInfo page_info = 1;
  repeated .sc.external.services.longterm.v1.OwnershipRecord results = 2;
}

message SetPersistentVariablesRequest {
  .sc.internal.services.longterm.v1.SetPersistentVariablesCommand command = 1;
  .sc.external.common.command.v1.CommandArguments arguments = 2;
}

message SetPersistentVariablesResponse {}

message ChangePersistentVariablesRequest {
  .sc.internal.services.longterm.v1.ChangePersistentVariablesCommand command = 1;
  .sc.external.common.command.v1.CommandArguments arguments = 2;
}

message ChangePersistentVariablesResponse {}

