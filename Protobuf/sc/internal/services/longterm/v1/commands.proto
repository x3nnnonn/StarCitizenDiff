syntax = "proto3";

package sc.internal.services.longterm.v1;

import "sc/external/services/entitygraph/v1/types.proto";

message SetPersistentVariablesCommand {
  uint64 player_id = 1;
  repeated .sc.internal.services.longterm.v1.SetPersistentVariablesCommand.Body updates = 2;

  message Body {
    string ltp_urn = 1;
    .sc.external.services.entitygraph.v1.EntitySnapshot persistent_variables = 2;
  }
}

message ChangePersistentVariablesCommand {
  uint64 player_id = 1;
  repeated .sc.internal.services.longterm.v1.ChangePersistentVariablesCommand.Body updates = 2;

  message Body {
    string ltp_urn = 1;
    .sc.external.services.entitygraph.v1.EntitySnapshot persistent_variables = 2;
  }
}

