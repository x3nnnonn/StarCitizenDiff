syntax = "proto3";

package sc.internal.services.longterm.v1;

import "sc/external/services/entitygraph/v1/types.proto";

message SetPersistentPropertiesCommand {
  uint64 player_id = 1;
  repeated .sc.internal.services.longterm.v1.SetPersistentPropertiesCommand.Body updates = 2;

  message Body {
    string ltp_urn = 1;
    .sc.external.services.entitygraph.v1.PersistentEntityProperties persistent_properties = 2;
  }
}

