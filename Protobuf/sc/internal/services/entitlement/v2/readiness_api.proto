syntax = "proto3";

package sc.internal.services.entitlement.v2;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sc/internal/services/entitlement/v2/commands.proto";
import "sc/external/common/command/v1/types.proto";

service AccountReadinessService {
  rpc ReconcileAccount (.sc.internal.services.entitlement.v2.ReconcileAccountRequest) returns (.sc.internal.services.entitlement.v2.ReconcileAccountResponse);
}

message ReconcileAccountRequest {
  .sc.internal.services.entitlement.v2.ReconcileAccountCommand command = 1;
  .sc.external.common.command.v1.CommandArguments arguments = 2;
}

message ReconcileAccountResponse {}

