syntax = "proto3";

package sc.external.services.dynamic_game_assets.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sc/external/services/dynamic_game_assets/v1/types.proto";

service DynamicGameAssetsService {
  rpc GetAssetForScreen ( .sc.external.services.dynamic_game_assets.v1.GetAssetForScreenRequest ) returns ( .sc.external.services.dynamic_game_assets.v1.GetAssetForScreenResponse );
}

message GetAssetForScreenRequest {
  string screen_id = 1;
}

message GetAssetForScreenResponse {
  .sc.external.services.dynamic_game_assets.v1.Asset asset = 1;
}

