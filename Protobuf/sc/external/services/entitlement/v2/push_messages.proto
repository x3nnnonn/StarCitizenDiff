syntax = "proto3";

package sc.external.services.entitlement.v2;

import "sc/external/services/entitlement/v2/types.proto";
message ReconcileAccountUpdateNotification {
  string command_id = 1;
  .sc.external.services.entitlement.v2.ReconcileAccountPhase phase = 2;
  string details = 3;
  string account_urn = 4;
  string player_urn = 5;
  .sc.external.services.entitlement.v2.ReconcileAccountStatus status = 6;
}

message RealtimeFulfillmentUpdateNotification {
  string command_id = 1;
  .sc.external.services.entitlement.v2.RealtimeFulfillmentProcessorStatus status = 2;
  int32 account_id = 3;
}

