syntax = "proto3";

package sc.external.services.entitlement.v2;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sc/external/services/entitlement/v2/types.proto";
import "sc/external/common/command/v1/types.proto";

service ExternalEntitlementService {
  rpc QueryEntitlementsStream (.sc.external.services.entitlement.v2.QueryEntitlementsStreamRequest) returns (stream .sc.external.services.entitlement.v2.QueryEntitlementsStreamResponse);
  rpc QuerySnapshotsStream (.sc.external.services.entitlement.v2.QuerySnapshotsStreamRequest) returns (stream .sc.external.services.entitlement.v2.QuerySnapshotsStreamResponse);
  rpc QuerySnapshotsWithEntitlementsStream (.sc.external.services.entitlement.v2.QuerySnapshotsWithEntitlementsStreamRequest) returns (stream .sc.external.services.entitlement.v2.QuerySnapshotsWithEntitlementsStreamResponse);
  rpc QueryEntitlementsByItemTypeStream (.sc.external.services.entitlement.v2.QueryEntitlementsByItemTypeStreamRequest) returns (stream .sc.external.services.entitlement.v2.QueryEntitlementsByItemTypeStreamResponse);
  rpc QueryEntitlementsBySourceTypeStream (.sc.external.services.entitlement.v2.QueryEntitlementsBySourceTypeStreamRequest) returns (stream .sc.external.services.entitlement.v2.QueryEntitlementsBySourceTypeStreamResponse);
  rpc QueryEntitlementsByEntityClassStream (.sc.external.services.entitlement.v2.QueryEntitlementsByEntityClassStreamRequest) returns (stream .sc.external.services.entitlement.v2.QueryEntitlementsByEntityClassStreamResponse);
  rpc QueryEntitlementsByEntityGeidsStream (.sc.external.services.entitlement.v2.QueryEntitlementsByEntityGeidsStreamRequest) returns (stream .sc.external.services.entitlement.v2.QueryEntitlementsByEntityGeidsStreamResponse);
  rpc UpdateArenaCommanderLoadout (.sc.external.services.entitlement.v2.UpdateArenaCommanderLoadoutRequest) returns (.sc.external.services.entitlement.v2.UpdateArenaCommanderLoadoutResponse);
}

message QueryEntitlementsStreamRequest {
  optional .sc.external.services.entitlement.v2.EntitlementFilter filter = 1;
}

message QueryEntitlementsStreamResponse {
  repeated .sc.external.services.entitlement.v2.Entitlement results = 1;
}

message QuerySnapshotsStreamRequest {
  optional .sc.external.services.entitlement.v2.SnapshotFilter filter = 1;
}

message QuerySnapshotsStreamResponse {
  repeated .sc.external.services.entitlement.v2.SnapshotRecord results = 1;
}

message QuerySnapshotsWithEntitlementsStreamRequest {
  optional .sc.external.services.entitlement.v2.SnapshotFilter filter = 1;
}

message QuerySnapshotsWithEntitlementsStreamResponse {
  repeated .sc.external.services.entitlement.v2.SnapshotWithEntitlement results = 1;
}

message QueryEntitlementsByItemTypeStreamRequest {
  string item_type = 1;
  optional string item_sub_type = 2;
}

message QueryEntitlementsByItemTypeStreamResponse {
  repeated .sc.external.services.entitlement.v2.Entitlement results = 1;
}

message QueryEntitlementsBySourceTypeStreamRequest {
  .sc.external.services.entitlement.v2.EntitlementSourceType source_type = 1;
  repeated string entitlement_urns = 2;
}

message QueryEntitlementsBySourceTypeStreamResponse {
  repeated .sc.external.services.entitlement.v2.Entitlement results = 1;
}

message QueryEntitlementsByEntityClassStreamRequest {
  repeated string entity_class_guids = 1;
  repeated .sc.external.services.entitlement.v2.EntitlementSourceType source_types = 2;
}

message QueryEntitlementsByEntityClassStreamResponse {
  repeated .sc.external.services.entitlement.v2.Entitlement results = 1;
}

message QueryEntitlementsByEntityGeidsStreamRequest {
  repeated uint64 entity_geids = 1;
}

message QueryEntitlementsByEntityGeidsStreamResponse {
  repeated .sc.external.services.entitlement.v2.Entitlement results = 1;
}

message UpdateArenaCommanderLoadoutRequest {
  .sc.external.common.command.v1.CommandArguments arguments = 1;
  string urn = 2;
  .sc.external.services.entitlement.v2.ItemPortLoadout loadout = 3;
}

message UpdateArenaCommanderLoadoutResponse {}

